<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>window.location.href = 'index.html';</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>iFood - Configurações de Integração</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tailwind-compiled.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Estilos extras específicos para esta página */
    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0,0,0,0.05);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased p-4 md:p-8">

  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <header class="flex items-center gap-4 mb-8">
      <div class="w-12 h-12 rounded-xl bg-red-600 text-white flex items-center justify-center text-xl shadow-lg">
        <i class="fa-solid fa-motorcycle"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Integração iFood</h1>
        <p class="text-slate-500">Configure as chaves de acesso (Inventory & Catalog API)</p>
      </div>
    </header>

    <!-- Form Panel -->
    <main class="glass-panel p-6 md:p-8">
      <form id="ifood-form" class="space-y-6">
        
        <!-- Loja Selector -->
        <div>
          <label for="loja" class="block text-sm font-semibold text-slate-700 mb-1">Loja (Operação)</label>
          <select id="loja" name="loja" required class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 transition-colors bg-white">
            <option value="" disabled selected>Selecione a loja...</option>
            <option value="marambaia">Marambaia</option>
            <option value="icoaraci">Icoaraci</option>
            <option value="mario-covas">Mário Covas</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Merchant ID -->
          <div class="md:col-span-2">
            <label for="merchantId" class="block text-sm font-semibold text-slate-700 mb-1">Merchant ID (ID da Loja no iFood)</label>
            <input type="text" id="merchantId" name="merchantId" required placeholder="Ex: 1a2b3c4d-5e6f-7g8h-9i0j..." class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 transition-colors">
          </div>

          <!-- Client ID -->
          <div class="md:col-span-2">
            <label for="clientId" class="block text-sm font-semibold text-slate-700 mb-1">Client ID</label>
            <input type="text" id="clientId" name="clientId" required placeholder="Seu Client ID" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 transition-colors">
          </div>

          <!-- Client Secret -->
          <div class="md:col-span-2">
            <label for="clientSecret" class="block text-sm font-semibold text-slate-700 mb-1">Client Secret</label>
            <input type="password" id="clientSecret" name="clientSecret" placeholder="Deixe em branco para manter a atual" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 transition-colors">
            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-circle-info"></i> Opcional caso já tenha sido salvo anteriormente.</p>
          </div>
        </div>

        <!-- Feedback Area -->
        <div id="feedback-message" class="hidden rounded-lg p-4 text-sm font-medium"></div>

        <!-- Submit -->
        <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
          <a href="/ifood-gerenciamento.html" class="text-slate-500 hover:text-slate-800 font-medium transition-colors">
            <i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao Painel iFood
          </a>
          <button type="submit" id="btn-salvar" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-md shadow-red-200 transition-all transform active:scale-95 flex items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i> Salvar Integração
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="ifood-config.js"></script>
</body>
</html>
