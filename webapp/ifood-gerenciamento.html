<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>iFood — Gerenciamento da Integração</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #ea1d2c;
      --primary-dark: #c11522;
      --bg: #f7f7f8;
      --card: #fff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --ok: #16a34a;
      --ok-bg: #dcfce7;
      --warn: #d97706;
      --warn-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header.topo {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header.topo .icone {
      width: 46px; height: 46px; border-radius: 12px;
      background: rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    header.topo h1 { margin: 0; font-size: 1.15rem; }
    header.topo p { margin: 2px 0 0; font-size: 0.82rem; opacity: 0.9; }
    header.topo a.voltar {
      margin-left: auto; color: #fff; text-decoration: none; font-size: 0.85rem;
      display: flex; align-items: center; gap: 6px; opacity: 0.9; white-space: nowrap;
    }
    header.topo a.voltar:hover { opacity: 1; }

    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    .toolbar h2 { margin: 0; font-size: 1rem; color: var(--text); }
    .toolbar .resumo { font-size: 0.82rem; color: var(--muted); }
    button.btn {
      border: none; border-radius: 8px; padding: 9px 14px; font-size: 0.84rem; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s, transform .05s;
    }
    button.btn:active { transform: scale(0.97); }
    button.btn:disabled { opacity: 0.6; cursor: not-allowed; }
    button.btn-primary { background: var(--primary); color: #fff; }
    button.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    button.btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
    button.btn-outline:hover:not(:disabled) { background: #f3f4f6; }
    button.btn-sm { padding: 6px 10px; font-size: 0.76rem; }

    .grid-lojas {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 24px;
    }
    .card-loja {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
      cursor: pointer; transition: border-color .15s, box-shadow .15s;
    }
    .card-loja:hover { border-color: var(--primary); box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    .card-loja.selecionada { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(234,29,44,0.15); }
    .card-loja .nome { font-weight: 700; font-size: 0.92rem; margin-bottom: 6px; }
    .card-loja .linha-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    .badge { padding: 3px 9px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; }
    .badge.ok { background: var(--ok-bg); color: #14532d; }
    .badge.pendente { background: var(--warn-bg); color: #78350f; }
    .badge.pausado { background: #f3f4f6; color: var(--muted); }

    .painel {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .painel h3 { margin: 0 0 12px; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }

    nav.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    nav.abas button {
      border: none; background: none; padding: 10px 14px; font-size: 0.83rem; cursor: pointer;
      color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600;
    }
    nav.abas button.ativa { color: var(--primary-dark); border-color: var(--primary); }
    .conteudo-aba { display: none; }
    .conteudo-aba.ativa { display: block; }

    table.tabela-sync { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    table.tabela-sync th, table.tabela-sync td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    table.tabela-sync th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; }
    table.tabela-sync tbody tr:hover { background: #fafafa; }
    .tabela-wrap { overflow-x: auto; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .campo label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .campo input, .campo select {
      width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem;
    }
    .campo input:focus, .campo select:focus { outline: none; border-color: var(--primary); }
    .campo .dica { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }

    .vazio { text-align: center; color: var(--muted); padding: 30px; font-size: 0.85rem; }
    .feedback { padding: 10px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; margin-bottom: 12px; display: none; }
    .feedback.sucesso { background: var(--ok-bg); color: #14532d; display: block; }
    .feedback.erro { background: var(--danger-bg); color: #7f1d1d; display: block; }

    .rodape-form { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topo">
    <div class="icone"><i class="fa-solid fa-motorcycle"></i></div>
    <div>
      <h1>Gerenciamento iFood</h1>
      <p>Configuração, sincronização de estoque e histórico por loja</p>
    </div>
    <a href="/" class="voltar"><i class="fa-solid fa-arrow-left"></i> Voltar ao App</a>
  </header>

  <main>
    <div class="toolbar">
      <h2>Lojas</h2>
      <div class="resumo" id="resumo-geral">Carregando visão geral...</div>
    </div>

    <div class="grid-lojas" id="grid-lojas"></div>

    <section class="painel" id="painel-detalhe" style="display:none;">
      <h3><i class="fa-solid fa-store"></i> <span id="detalhe-nome-loja"></span></h3>

      <nav class="abas">
        <button data-aba="sync" class="ativa">Sincronização</button>
        <button data-aba="config">Configuração</button>
      </nav>

      <div class="conteudo-aba ativa" id="aba-sync">
        <div class="toolbar">
          <div class="resumo" id="sync-resumo"></div>
          <button class="btn btn-primary" id="btn-sincronizar">
            <i class="fa-solid fa-rotate"></i> Sincronizar agora
          </button>
        </div>
        <div id="feedback-sync" class="feedback"></div>
        <div class="tabela-wrap">
          <table class="tabela-sync" id="tabela-sync">
            <thead>
              <tr>
                <th>Descrição</th>
                <th>Cód. Local</th>
                <th>Cód. iFood</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tabela-sync-body"></tbody>
          </table>
        </div>
        <div class="vazio" id="sync-vazio" style="display:none;">Nenhuma sincronização registrada para esta loja ainda.</div>
      </div>

      <div class="conteudo-aba" id="aba-config">
        <div id="feedback-config" class="feedback"></div>
        <form id="form-config">
          <div class="form-grid">
            <div class="campo full">
              <label for="input-merchant-id">Merchant ID (ID da Loja no iFood)</label>
              <input type="text" id="input-merchant-id" placeholder="Ex: 1a2b3c4d-5e6f-7g8h-9i0j...">
            </div>
            <div class="campo full">
              <label for="input-client-id">Client ID</label>
              <input type="text" id="input-client-id" placeholder="Seu Client ID">
            </div>
            <div class="campo full">
              <label for="input-client-secret">Client Secret</label>
              <input type="password" id="input-client-secret" placeholder="Deixe em branco para manter a atual">
              <div class="dica"><i class="fa-solid fa-circle-info"></i> Opcional caso já tenha sido salvo anteriormente.</div>
            </div>
          </div>
          <div class="rodape-form">
            <button type="submit" class="btn btn-primary" id="btn-salvar-config">
              <i class="fa-solid fa-cloud-arrow-up"></i> Salvar configuração
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="ifood-gerenciamento.js"></script>
</body>
</html>
