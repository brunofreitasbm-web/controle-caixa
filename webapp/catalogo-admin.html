<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — Painel interno</title>
  <style>
    :root {
      --primary: #c98a4b;
      --primary-dark: #a8703a;
      --bg: #faf7f2;
      --card: #fff;
      --text: #3a2a1e;
      --muted: #8a7768;
      --border: #eee1d3;
      --ok: #2e8b57;
      --warn: #d97706;
      --danger: #c0392b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--primary-dark); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.05rem; margin: 0; }
    #usuario-atual { font-size: 0.85rem; opacity: 0.9; }

    nav.tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); overflow-x: auto; }
    nav.tabs button {
      flex: 1; padding: 12px 8px; border: none; background: none; font-size: 0.85rem; cursor: pointer;
      border-bottom: 3px solid transparent; white-space: nowrap; color: var(--muted);
    }
    nav.tabs button.ativo { color: var(--primary-dark); border-color: var(--primary); font-weight: 700; }

    main { padding: 14px; max-width: 900px; margin: 0 auto; }
    .painel { display: none; }
    .painel.ativo { display: block; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .card h3 { margin: 0 0 6px; font-size: 0.95rem; }
    .linha { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.85rem; margin: 4px 0; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
    .badge.novo { background: #fde68a; color: #92400e; }
    .badge.aguardando_pagamento { background: #bfdbfe; color: #1e3a8a; }
    .badge.liberado { background: #bbf7d0; color: #166534; }
    .badge.cancelado { background: #fecaca; color: #7f1d1d; }

    button.acao {
      border: none; border-radius: 8px; padding: 8px 12px; font-size: 0.82rem; font-weight: 700; cursor: pointer; color: #fff;
    }
    button.acao.confirmar { background: var(--warn); }
    button.acao.liberar { background: var(--ok); }
    button.acao.cancelar { background: var(--danger); }

    input, select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; }
    label.toggle { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }

    #login-box { max-width: 340px; margin: 60px auto; padding: 20px; background: #fff; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    #login-box input { width: 100%; margin: 6px 0; padding: 10px; }
    #login-box button { width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 700; margin-top: 6px; cursor: pointer; }
    #login-erro { color: var(--danger); font-size: 0.82rem; min-height: 1.2em; }

    #app { display: none; }
    .filtros { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .vazio { color: var(--muted); text-align: center; padding: 30px; }
    .foto-mini { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; background: #f2e9dd; }
  </style>
</head>
<body>
  <div id="login-box">
    <h2>Painel do Catálogo</h2>
    <input type="text" id="login-usuario" placeholder="Seu nome (como no cadastro)">
    <input type="password" id="login-pin" placeholder="PIN">
    <button id="btn-login">Entrar</button>
    <div id="login-erro"></div>
  </div>

  <div id="app">
    <header>
      <h1>🍫 Painel do Catálogo</h1>
      <span id="usuario-atual"></span>
    </header>

    <nav class="tabs">
      <button data-tab="pedidos" class="ativo">Pedidos</button>
      <button data-tab="produtos">Produtos</button>
      <button data-tab="lojas">Lojas / Pix</button>
    </nav>

    <main>
      <section class="painel ativo" id="painel-pedidos">
        <div class="filtros">
          <select id="filtro-status">
            <option value="">Todos os status</option>
            <option value="novo">Novo</option>
            <option value="aguardando_pagamento">Aguardando pagamento</option>
            <option value="liberado">Liberado</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <select id="filtro-loja">
            <option value="">Todas as lojas</option>
            <option value="Marambaia">Marambaia</option>
            <option value="Icoaraci">Icoaraci</option>
            <option value="Mário Covas">Mário Covas</option>
          </select>
          <button class="acao confirmar" id="btn-atualizar-pedidos" style="background:#555">Atualizar</button>
        </div>
        <div id="lista-pedidos"><div class="vazio">Carregando pedidos...</div></div>
      </section>

      <section class="painel" id="painel-produtos">
        <div class="filtros">
          <input type="text" id="busca-produto" placeholder="Buscar por nome ou código...">
          <select id="filtro-visivel">
            <option value="">Todos</option>
            <option value="1">Visíveis no catálogo</option>
            <option value="0">Ocultos</option>
          </select>
        </div>
        <div id="lista-produtos"><div class="vazio">Digite algo para buscar ou selecione um filtro.</div></div>
      </section>

      <section class="painel" id="painel-lojas">
        <div id="lista-lojas"><div class="vazio">Carregando lojas...</div></div>
      </section>
    </main>
  </div>

  <script src="catalogo-admin.js"></script>
</body>
</html>
