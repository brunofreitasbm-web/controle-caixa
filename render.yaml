databases:
  - name: hub-operacoes-db
    plan: free
    databaseName: hub_operacoes
    user: hub_operacoes

services:
  - type: web
    name: hub-operacoes
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/colaboradores
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: hub-operacoes-db
          property: connectionString
