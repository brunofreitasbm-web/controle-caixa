services:
  - type: web
    name: hub-operacoes
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/colaboradores
    envVars:
      - key: NODE_VERSION
        value: 20
      # Banco de produção: Postgres do Supabase (projeto "controle-caixa").
      # Definido manualmente no painel do Render — NUNCA versionar a string de
      # conexão aqui. Deve ser a mesma URL já usada pela implantação anterior.
      - key: DATABASE_URL
        sync: false
